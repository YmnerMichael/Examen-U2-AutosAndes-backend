spring.application.name=backendAutoAndes
server.port=8080
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
spring.datasource.username=${DB_USER:PHARMADB[AUTOANDES]}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:AUTOANDES}
spring.flyway.enabled=true
spring.flyway.default-schema=${DB_SCHEMA:AUTOANDES}
spring.flyway.schemas=${DB_SCHEMA:AUTOANDES}
spring.flyway.create-schemas=false
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${JWT_SECRET:AutoAndes-Clave-Local-De-Prueba-2026-32-Caracteres}
app.zone=America/Lima
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.pe.edu.upeu.autoandes=INFO
